# p2p0 is the Wi-Fi driver's own Wi-Fi Direct interface and it is not used as a network. NetworkManager sees an Ethernet
# device there, creates "Wired connection 1" on it and asks for a DHCP lease that never comes (it stays "activating" and
# retries forever). Only NetworkManager is told to ignore it: the interface, its MAC and wpa_supplicant's P2P are not
# touched. Wi-Fi Direct / Miracast goes through NetworkManager's own p2p-dev-wlan0 device and the p2p-wlan0-* group
# interface (s9-miracast.py), not through p2p0.
#
# swlan0 (90-s9-swlan0-unmanaged.conf) must stay unmanaged as well: it shares its MAC with p2p0 (wlan0's differs only by
# the locally-administered bit), and p2p0 only works with its own MAC while NetworkManager leaves swlan0 alone.
[keyfile]
unmanaged-devices+=interface-name:p2p0
