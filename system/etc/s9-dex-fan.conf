# s9-dex-fan - ajustes (relido a cada ciclo; nao precisa reiniciar o servico)
MIN_LEVEL=low      # off|low|medium|high  (piso do modo automatico)
MAX_LEVEL=high
INTERVAL=5         # s entre leituras
DWELL=20           # s minimos antes de DESCER de nivel
REASSERT=60        # s: reenvia o nivel (a dock pode voltar ao padrao ao reconectar)
T_LOW_ON=50        # C: sobe para low (so vale com MIN_LEVEL=off)
T_LOW_OFF=45
T_MED_ON=62        # C: sobe para medium
T_MED_OFF=56
T_HIGH_ON=72       # C: sobe para high
T_HIGH_OFF=66
T_EMERG=80         # C: high imediato
CODE_OFF=0xA0200110
CODE_LOW=0xA0200111
CODE_MEDIUM=0xA0200112
CODE_HIGH=0xA0200113
