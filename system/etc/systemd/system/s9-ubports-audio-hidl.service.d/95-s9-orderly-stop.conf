# S9_AUDIO_ORDERLY_STOP_V1: quiesce do audio (streams -> perfil off -> descarregar modulos droid) enquanto o Android ainda esta de pe.
# O ExecStop roda antes do SIGTERM ao Pulse. After=user-runtime-dir@1000 garante que /run/user/1000 ainda exista na hora.
[Unit]
After=user-runtime-dir@1000.service

[Service]
ExecStop=-/usr/local/sbin/s9-audio-shutdown
TimeoutStopSec=30
